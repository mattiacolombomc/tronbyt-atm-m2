name: Rebuild timetable

on:
  schedule:
    # 03:17 UTC = 04:17/05:17 in Milan, after the last M2 train and before the first
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest tools/test_build_timetable.py
      - name: Build timetable.json
        run: python tools/build_timetable.py --out timetable.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timetable.json
          git diff --cached --quiet || git commit -m "Update timetable $(date -u +%F)"
          git push
